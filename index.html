<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RootifyONE</title>
  <meta name="description" content="RootifyONE — administração central da plataforma SolverONE">
  <meta name="robots" content="noindex, nofollow">
  <!-- Segurança: só roda código deste próprio site; só conversa com GitHub e provedores de IA -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://marceloneco.github.io https://api.github.com https://openrouter.ai https://api.groq.com https://generativelanguage.googleapis.com https://api.mistral.ai https://api.openai.com https://api.anthropic.com; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="rootify.css">
</head>
<body>
  <noscript><p style="padding:1rem">O RootifyONE precisa de JavaScript ligado. · RootifyONE needs JavaScript enabled.</p></noscript>

  <!-- telas de acesso (instalação, entrar, bloqueio) — sem menu -->
  <div id="rf-acesso" hidden></div>

  <!-- o app, depois de entrar -->
  <div id="rf-casca" hidden>
    <a class="rf-pular" href="#rf-main">Pular para o conteúdo</a>
    <header class="rf-topo">
      <button id="rf-bt-menu" type="button" aria-expanded="false" aria-controls="rf-menu" aria-label="Menu com todas as funções">☰</button>
      <div id="rf-marca" role="button" tabindex="0" aria-label="RootifyONE — início">
        <span aria-hidden="true">🌳</span><strong>RootifyONE</strong><span id="rf-topo-tit"></span>
      </div>
      <div class="rf-topo-acoes">
        <button id="rf-bt-busca" type="button" aria-label="Buscar" title="Ctrl+K">🔍</button>
        <button id="rf-bt-config" type="button" aria-label="Configurações">⚙</button>
        <button id="rf-bt-inicio" type="button" aria-label="Início">🏠</button>
        <button id="rf-bt-pessoa" type="button" aria-label="Sua conta">👤</button>
      </div>
    </header>
    <div id="rf-faixa-sim" class="rf-faixa-sim" role="status" hidden></div>
    <nav id="rf-menu" aria-label="Menu"></nav>
    <div id="rf-menu-fundo" aria-hidden="true"></div>
    <main id="rf-main" tabindex="-1"></main>
    <nav id="rf-barra-baixo" aria-label="Atalhos"></nav>
  </div>

  <!-- módulo comum da SolverONE (as duas linhas de sempre) -->
  <script src="diretrizes.js"></script>
  <script src="diretrizes-config.js"></script>

  <!-- RootifyONE -->
  <script src="rootify-catalogo.js"></script>
  <script src="rootify-base.js"></script>
  <script src="rootify-dados.js"></script>
  <script src="rootify-telas-1.js"></script>
  <script src="rootify-telas-2.js"></script>
  <script src="rootify-ia-termos.js"></script>
  <script src="rootify-app.js"></script>
</body>
</html>
